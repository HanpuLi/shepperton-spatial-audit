name: Reproducibility

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: reproducibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install analysis dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile tracked Python
        run: |
          python - <<'PY'
          import pathlib, py_compile, subprocess
          files = [p for p in subprocess.check_output(["git","ls-files","*.py"], text=True).splitlines()]
          for name in files:
              py_compile.compile(name, doraise=True)
          print(f"compiled {len(files)} Python files")
          PY
      - name: Import analysis stack
        run: |
          python - <<'PY'
          import ee, matplotlib, numpy, pandas, pymannkendall, pyproj, scipy, shapely, statsmodels
          print("analysis imports ok")
          PY
      - name: Repository reproducibility boundary
        run: python tools/check_repository.py
