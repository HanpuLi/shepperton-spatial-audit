name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Tag/version guard
        run: test "v$(tr -d '[:space:]' < VERSION)" = "$GITHUB_REF_NAME"
      - name: Install analysis dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile tracked Python
        run: |
          python - <<'PY'
          import py_compile, subprocess
          files = subprocess.check_output(["git", "ls-files", "*.py"], text=True).splitlines()
          for name in files:
              py_compile.compile(name, doraise=True)
          print(f"compiled {len(files)} Python files")
          PY
      - name: Import analysis stack
        run: |
          python - <<'PY'
          import ee, matplotlib, numpy, pandas, pymannkendall, pyproj, scipy, shapely, statsmodels
          print("analysis imports ok")
          PY
      - name: Repository reproducibility boundary
        run: python tools/check_repository.py

  github-release:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Create source snapshot release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME"             --repo "$GITHUB_REPOSITORY"             --verify-tag             --title "Shepperton Spatial Audit $GITHUB_REF_NAME"             --notes "Citable source/reproducibility snapshot. Remote Earth Engine and Overpass services may change independently; see REPRODUCIBILITY.md."
